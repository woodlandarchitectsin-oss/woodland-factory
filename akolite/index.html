<style>
/* Layout: factory register. Rail of departments, a factory switch, pieces of figures measured in pieces, sq ft and sq ft x mm */
:root{
  --bg:#eff1ec;--surface:#fff;--surface2:#f4f5f1;--line:#d7dbd0;--fg:#1b241d;--muted:#5a665c;
  --rail:#1d3328;--rail-fg:#dfe8e0;--rail-muted:#94a998;--rail-on:#2c4a3a;--grain:#d3a35a;
  --accent:#27624a;--accent-ink:#fff;
  --crit:#b3261e;--crit-soft:#f9e4e2;--warn:#8a5a00;--warn-soft:#f7ecd6;--ok:#22704a;--ok-soft:#dff1e7;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10170f;--surface:#18211a;--surface2:#1f2a21;--line:#303d32;--fg:#e5ebe4;--muted:#a1aea2;
  --rail:#0c130d;--rail-on:#233429;--accent:#79c6a2;--accent-ink:#0b2118;
  --crit:#f18b82;--crit-soft:#3b1f1d;--warn:#e5b65e;--warn-soft:#352a13;--ok:#7dd1a2;--ok-soft:#16301f;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10170f;--surface:#18211a;--surface2:#1f2a21;--line:#303d32;--fg:#e5ebe4;--muted:#a1aea2;
  --rail:#0c130d;--rail-on:#233429;--accent:#79c6a2;--accent-ink:#0b2118;
  --crit:#f18b82;--crit-soft:#3b1f1d;--warn:#e5b65e;--warn-soft:#352a13;--ok:#7dd1a2;--ok-soft:#16301f;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
.demo{background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:500;padding-block:5px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-fg);padding-block:18px}
.brand{padding:0 18px 14px;border-bottom:1px solid var(--rail-on);margin-bottom:8px}
.brand b{display:block;font:700 22px/1.1 var(--display);letter-spacing:.03em}
.brand span{font-size:12px;color:var(--rail-muted)}
.nav{display:flex;flex-direction:column;gap:1px;padding:0 8px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:5px;white-space:nowrap}
.nav button:hover{background:var(--rail-on)}
.nav button:focus-visible{outline:2px solid var(--grain)}
.nav button.on{background:var(--rail-on);box-shadow:inset 3px 0 0 var(--grain)}
.nav i{font-style:normal;font-size:12px;font-weight:600;background:var(--crit);color:#fff;border-radius:9px;padding:0 7px}
.who{padding:14px 18px 0;font-size:13px;color:var(--rail-muted)}
.who button{all:unset;cursor:pointer;color:var(--rail-fg);text-decoration:underline;display:block;margin-top:4px}
.main{padding-block:22px 48px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));min-width:0;max-width:1240px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
h1{font-size:34px;font-weight:700;line-height:1.05}
.sub{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:10px 14px}
.tile b{display:block;font:600 29px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile small{display:block;color:var(--muted);font-size:12px}
.tile.hot b{color:var(--crit)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:5px;min-width:0;margin-bottom:14px}
.panel.alert{border-color:var(--crit)}
.panel h2{font-size:18px;font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel.alert h2{color:var(--crit);background:var(--crit-soft)}
.none{padding:18px 14px;color:var(--muted)}
.note{padding:10px 14px;color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px;align-items:start}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;background:var(--surface2);white-space:nowrap}
th,td{padding:7px 11px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nw{white-space:nowrap}
tr.tot td{font-weight:600;background:var(--surface2)}
.btn{cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:7px 12px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri,.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dang{color:var(--crit)}
.btn.sm{padding:3px 9px;font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:9px;background:var(--surface2);white-space:nowrap}
.pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.ok{background:var(--ok-soft);color:var(--ok)}
.wrap{position:fixed;inset:0;z-index:20;background:rgba(5,15,8,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:6px;width:100%;max-width:600px;padding:18px}
.modal.wide{max-width:860px}
.modal h2{font-size:24px;font-weight:600;margin-bottom:12px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:500;color:var(--muted);min-width:0}
.form input,.form select{width:100%;padding:8px 10px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:5px;font-size:15px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.err{color:var(--crit);margin-top:10px}.err:empty{display:none}
.calc{margin-top:12px;padding:8px 12px;background:var(--surface2);border-radius:5px;font-size:14px}.calc:empty{display:none}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px;width:100%;max-width:420px;display:grid;gap:12px}
.login label{display:grid;gap:3px;font-size:13px;font-weight:500;color:var(--muted)}
.login input,.login select{padding:9px 10px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:5px;width:100%;font-size:15px}
@media (max-width:760px){
  .app{display:block}
  .rail{padding-block:10px 6px}
  .brand{padding:0 max(16px,env(safe-area-inset-left,0px)) 6px;border:0;margin:0}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;padding:0 max(16px,env(safe-area-inset-left,0px)) 4px}
  .nav button.on{box-shadow:inset 0 -3px 0 var(--grain)}
  .who{padding:4px max(16px,env(safe-area-inset-left,0px)) 0}.who button{display:inline;margin-left:8px}
  .main{padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .form{grid-template-columns:minmax(0,1fr)}
}
[hidden]{display:none!important}body{margin:0}
</style></head><body>
<div id="root"></div>
<div id="layer"></div>
<script src="../vendor/supabase.js"></script>
<script src="../config.js"></script>
<script src="../docs.js"></script>
<script>
const FACTORIES=["Akolite"];
const GRADES=["Composite Production Pallets","Chequered Plywood","Truck-Flooring Panels","High-Density Plywood"];
const THICK=[4,6,8,9,12,16,18,19,25];
const SIZES=["8x4","8x3","7x4","7x3","6x4","6x3"];
const RAW=["Core veneer","Face veneer","Resin","Craft paper","Film","Rosewood paper","Timber"];
const RAW_UNIT={"Core veneer":"sq ft at 1 mm","Face veneer":"sq ft at 1 mm","Resin":"kg","Craft paper":"as entered","Film":"as entered","Rosewood paper":"as entered","Timber":"as entered"};
const COMPANY={name:"Akolite Industrial Systems Pvt Ltd",address:"Baikampady Industrial Area, Mangalore, Karnataka",team:"Team led by Mr. Saleem, with Biju, Monaka and Mustafa · Accounts: Ms. Shruthi (Tally)"};
const STATES=["Rajasthan","Chhattisgarh","Bihar","Odisha","Kerala","Karnataka","Tamil Nadu","Andhra Pradesh","Other"];
const CTYPES=["Machine manufacturer","Agent","End customer","Dealer","Contractor","Builder","Carpenter","Boat builder","Direct buyer","Other"];
const PRICE_GROUPS=[["15","Machine manufacturer"],["20","Agent"],["25","End customer"]],GROUP_OF={"Machine manufacturer":"15","Agent":"20","End customer":"25"};
const RATE_THICK=["18","20","25","30"],RATE_DENS=["1","1.1","1.2"];
const groupOf=r=>r.price_group||GROUP_OF[(DB.customers.find(c=>c.name===r.party)||{}).type]||"";
const dens=d=>d==null||d===""?"":String(Number(d));
const listRate=(g,thick,d)=>{const c=(DB.settings.rate_card||{}).groups||{};return ((c[g]||{})[String(Number(thick))]||{})[dens(d)]??null;};
const FLOOR_GRADE={"Truck-Flooring Panels":"Truck flooring","Chequered Plywood":"Chequered plywood"};
const floorRate=(grade,thick)=>{const f=((DB.settings.rate_card||{}).flooring||[]).find(x=>x.product===FLOOR_GRADE[grade]&&Number(x.thick)===Number(thick));return f?Number(f.rate):null;};
const groupLabel=g=>{const x=PRICE_GROUPS.find(p=>p[0]===g);return x?x[1]+" ("+g+"%)":"";};
const PAYCATS=["Raw material","Wages","Power","Transport","Other"];
const STAGES=["Peeling","Drying","Gluing","Pressing","Finishing","Grading"];
const ROLE_LABEL={admin:"Admin",production:"Production only",dispatch:"Dispatch only",marketer:"Marketer"};
const NAV={admin:[["today","Today"],["finished","Finished stock"],["raw","Raw materials"],["orders","Leads & orders"],["prices","Price list"],["followups","Follow-ups"],["marketers","Marketers"],["makers","Machine makers"],["machines","Machine models & pallets"],["pallets","Pallet sizes"],["remarks","Remarks"],["reports","Production report"],["production","Production"],["inward","Inward"],["rates","Purchase rates"],["dispatch","Dispatch"],["customers","Customers"],["vendors","Vendors"],["payables","Pending payments"],["money","Collections & payments"],["ledgers","Party ledgers"],["documents","Upload documents"],["check","Stock check"],["weekly","Weekly report"],["history","Who entered what"],["settings","Settings"]],production:[["production","Daily production"]],marketer:[["myleads","My leads"]],dispatch:[["dispatch","Daily dispatch"]]};


const today=()=>new Date().toLocaleDateString("en-CA");
const addDays=(iso,n)=>{const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return d.toLocaleDateString("en-CA");};
const fmtD=d=>d?new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short"}):"";
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=n=>new Intl.NumberFormat("en-IN",{maximumFractionDigits:1}).format(n||0);
const inr=n=>(n<0?"-":"")+"₹"+new Intl.NumberFormat("en-IN",{maximumFractionDigits:0}).format(Math.abs(n||0));
/* Plywood sizes are in feet (8x4). Pallet sizes are in mm (900x550). */
const area=s=>{const[a,b]=String(s).toLowerCase().split(/[x×*]/).map(Number);if(!a||!b)return 0;return a>100?a*b/92903:a*b;};
const sqft=r=>(Number(r.sheets)||0)*area(r.size);
const sqmm=r=>sqft(r)*(Number(r.thick)||0);
const $=id=>document.getElementById(id);

const EMPTY=()=>({party_entries:[],production:[],dispatch:[],inward:[],customers:[],collections:[],payments:[],counts:[],vendors:[],payables:[],factory_reports:[],orders:[],marketers:[],makers:[],machines:[],pallet_sizes:[],followups:[],remarks:[],log:[],settings:{veneer_factor:1,resin_per_k:1.6,rate_card:null}});
let DB=EMPTY();
const CFG=window.WOODLAND_CONFIG||{};
const sb0=CFG.url&&CFG.anonKey?supabase.createClient(CFG.url,CFG.anonKey):null;
/* Same screens as Woodland, reading Akolite's own tables. */
const sb=sb0&&{auth:sb0.auth,storage:sb0.storage,channel:n=>sb0.channel(n),removeChannel:c=>sb0.removeChannel(c),from:t=>sb0.from(t==="profiles"||t==="documents"?t:"ak_"+t),rpc:(f,a)=>sb0.rpc("ak_"+f,a)};

const S={user:null,view:"today",factory:"All",modal:null,err:"",loading:true,banner:""};
const isAdmin=()=>S.user&&S.user.role==="admin";

/* ---- all data goes through here; the database itself enforces who can see and change what ---- */
async function fetchAll(table,order){
  const out=[];
  for(let from=0;;from+=1000){
    let q=sb.from(table).select("*").range(from,from+999);
    if(order)q=q.order(order,{ascending:false});
    const {data,error}=await q;if(error)throw error;
    out.push(...data);if(data.length<1000)return out;
  }
}
const stampBy=r=>({...r,by:r.entered_by_name||""});
async function loadData(){
  const d=EMPTY(),role=S.user.role;
  if(role==="admin"){
    const [prod,dis,prices,inw,cust,col,pay,cnt,set,log]=await Promise.all([fetchAll("production"),fetchAll("dispatch"),fetchAll("dispatch_prices"),fetchAll("inward"),fetchAll("customers"),fetchAll("collections"),fetchAll("payments"),fetchAll("counts"),fetchAll("settings"),sb.from("audit_log").select("*").order("id",{ascending:false}).limit(200)]);
    const pm={};prices.forEach(p=>{pm[p.id]=p;});
    d.production=prod.map(stampBy);d.dispatch=dis.map(r=>stampBy({...r,rate:pm[r.id]?pm[r.id].rate:null,basis:pm[r.id]?pm[r.id].basis:null}));
    d.inward=inw.map(stampBy);d.party_entries=(await fetchAll("party_entries")).map(stampBy);d.customers=cust.map(stampBy);d.collections=col.map(stampBy);d.payments=pay.map(stampBy);d.counts=cnt.map(stampBy);
    for(const t of ["orders","marketers","makers","machines","pallet_sizes","followups","remarks"])d[t]=(await fetchAll(t)).map(stampBy);
    d.factory_reports=(await fetchAll("factory_reports")).map(stampBy);d.vendors=(await fetchAll("vendors")).map(stampBy);d.payables=(await fetchAll("payables")).map(stampBy);
    if(set[0])d.settings=set[0];
    if(log.error)throw log.error;
    d.log=(log.data||[]).map(l=>({at:l.at,user:l.user_name||"",role:l.user_role,action:l.action,table:l.table_name,summary:l.table_name==="dispatch_prices"?"Rate "+(l.row_data.rate==null?"cleared":l.row_data.rate):l.table_name==="settings"?"Automatic calculation figures":summary(l.table_name,l.row_data)}));
  }else if(role==="marketer"){const {data,error}=await sb.rpc("my_leads");if(error)throw error;d.orders=data||[];
  }else if(role==="production"){d.production=(await fetchAll("production")).map(stampBy);d.pallet_sizes=await fetchAll("pallet_sizes");}
  else{
    d.dispatch=(await fetchAll("dispatch")).map(stampBy);
    const {data,error}=await sb.rpc("customer_names");if(error)throw error;d.customers=data;
  }
  DB=d;
}
function friendly(e){
  const c=e&&e.code,m=String(e&&e.message||"");
  if(c==="23503")return "That customer isn't on the customer list. Add the customer first.";
  if(c==="23505")return "That name is already on the list.";
  if(c==="23514")return "One of the numbers isn't valid. Check for negative figures.";
  if(c==="42501"||/row-level security|permission denied/i.test(m))return "You don't have access to change this.";
  if(/fetch|network/i.test(m))return "Couldn't reach the server. Check the internet and try again. Your entry hasn't been saved.";
  return "This couldn't be saved. Try again, and tell an admin if it keeps happening.";
}
const Api={
  rows(t){return DB[t]||[];},
  async save(t,rec){
    if(t==="leads"){const {error}=await sb.rpc("add_lead",{p_party:rec.party,p_state:rec.state,p_phone:rec.phone,p_machine:rec.machine,p_pallet_size:rec.pallet_size,p_thick:rec.thick,p_density:rec.density,p_qty:rec.qty,p_remarks:rec.remarks});if(error)throw error;await refresh();return;}
    const {id,rate,basis,...row}=rec;let rid=id;
    if(id){const {error}=await sb.from(t).update(row).eq("id",id);if(error)throw error;}
    else{const {data,error}=await sb.from(t).insert(row).select("id").single();if(error)throw error;rid=data.id;}
    if(t==="dispatch"&&S.user.role==="admin"){
      const old=DB.dispatch.find(r=>r.id===rid)||{};
      if(rate!=null&&(rate!==old.rate||basis!==old.basis)){const {error}=await sb.from("dispatch_prices").upsert({id:rid,rate,basis});if(error)throw error;}
      else if(rate==null&&old.rate!=null){const {error}=await sb.from("dispatch_prices").delete().eq("id",rid);if(error)throw error;}
    }
    await refresh();
  },
  async remove(t,id){const {error}=await sb.from(t).delete().eq("id",id);if(error)throw error;await refresh();}
};
let refreshing=false,again=false,channel=null;
async function refresh(){
  if(!S.user)return;
  if(refreshing){again=true;return;}
  refreshing=true;
  try{await loadData();S.banner="";}catch(e){S.banner="Couldn't reach the server, so these figures may be out of date.";}
  refreshing=false;
  if(!S.user)return;
  const form=S.modal&&!S.modal.report,typing=document.activeElement&&["INPUT","SELECT"].includes(document.activeElement.tagName)&&!form;
  if(!typing)render();
  if(again){again=false;refresh();}
}
function listen(){
  if(channel)return;
  let timer=null;
  channel=sb.channel("akosys").on("postgres_changes",{event:"*",schema:"public"},()=>{clearTimeout(timer);timer=setTimeout(refresh,400);}).subscribe();
}
async function startSession(uid){
  const {data,error}=await sb.from("profiles").select("name,ak_role,active").eq("id",uid).maybeSingle();
  if(error)throw error;
  if(!data||!data.active||!data.ak_role){S.err="This login doesn't have Akolite access yet. Ask an admin to set it up.";S.user=null;await sb.auth.signOut();return false;}
  data.role=data.ak_role;
  S.user=data;S.view=NAV[data.role][0][0];
  await loadData();listen();
  return true;
}

function summary(t,r){
  if(t==="production"||t==="dispatch")return [r.factory,r.customer,r.grade,r.thick+" mm",r.size,num(r.sheets)+" pieces"].filter(Boolean).join(" · ");
  if(t==="inward")return [r.factory,r.item,num(r.qty)].join(" · ");
  if(t==="customers")return r.name;
  if(t==="collections")return r.customer+" · "+inr(r.amount);
  if(t==="party_entries")return r.customer+" · "+r.kind+(r.part?" ("+r.part+")":"")+" · "+inr(r.amount);
  if(t==="payments")return r.payee+" · "+inr(r.amount);
  if(t==="orders")return r.party+" · "+(r.status||"")+(r.qty?" · "+num(r.qty)+" pieces":"");
  if(t==="marketers")return r.region+" · "+(r.person||"");
  if(t==="makers")return r.name;
  if(t==="machines")return r.maker+" · "+r.model;
  if(t==="pallet_sizes")return r.size;
  if(t==="followups")return r.about;
  if(t==="remarks")return r.text;
  if(t==="factory_reports")return fmtD(r.date)+" production report";
  if(t==="vendors")return r.name;
  if(t==="payables")return r.vendor+" · "+inr(r.amount);
  if(t==="documents")return r.name+" · "+r.area+" · "+r.status;
  if(t==="counts")return [r.factory,r.item,num(r.qty)].join(" · ");
  return "";
}

/* ---- calculations ---- */
const inF=r=>S.factory==="All"||r.factory===S.factory;
function finishedStock(){
  const t={};const get=r=>{const k=[r.factory,r.grade,r.thick,r.size].join("|");return t[k]=t[k]||{factory:r.factory,grade:r.grade,thick:Number(r.thick),size:r.size,first:0,second:0};};
  DB.production.forEach(r=>{const x=get(r);x.first+=Number(r.sheets)||0;x.second+=Number(r.second)||0;});
  DB.dispatch.forEach(r=>{const x=get(r);x[r.quality==="Second"?"second":"first"]-=Number(r.sheets)||0;});
  return Object.values(t).sort((a,b)=>a.factory.localeCompare(b.factory)||a.grade.localeCompare(b.grade)||b.thick-a.thick);
}
function rawStock(){
  const out=[];FACTORIES.forEach(f=>RAW.forEach(item=>{
    const inw=DB.inward.filter(r=>r.factory===f&&r.item===item).reduce((a,r)=>a+(!/veneer/i.test(item)?Number(r.qty):Number(r.qty)*(Number(r.mm)||1)),0);

function lastBackup(){try{return localStorage.getItem("akosys-last-backup")||"";}catch(e){return "";}}
function downloadBackup(){
  const {log,...data}=DB,blob=new Blob([JSON.stringify({savedAt:new Date().toISOString(),savedBy:S.user.name,data,history:log},null,1)],{type:"application/json"});
  const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="akosys-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
  try{localStorage.setItem("akosys-last-backup",today());}catch(e){}
  render();
}
function weeklyHTML(){
  const w=lastWeek(),inW=r=>r.date>=w.from&&r.date<=w.to;
  const p=DB.production.filter(r=>inW(r)&&r.stage!=="Opening stock"),g={};
  p.forEach(r=>{const k=[r.factory,r.grade,r.thick,r.size].join("|");g[k]=g[k]||{...r,sheets:0,second:0,rejected:0};g[k].sheets+=Number(r.sheets);g[k].second+=Number(r.second)||0;g[k].rejected+=Number(r.rejected)||0;});
  const rows=Object.values(g).sort((a,b)=>a.factory.localeCompare(b.factory)||a.grade.localeCompare(b.grade));
  const dis=DB.dispatch.filter(inW),billed=dis.reduce((a,r)=>a+(dispatchAmount(r)||0),0),col=DB.collections.filter(inW).reduce((a,r)=>a+Number(r.amount),0),paid=DB.payments.filter(inW).reduce((a,r)=>a+Number(r.amount),0);
  const rec=receivables(),out=rec.reduce((a,x)=>a+x.balance,0),od=rec.reduce((a,x)=>a+x.overdue,0);
  const rep=DB.factory_reports.filter(inW),rs=k=>rep.reduce((a,r)=>a+(Number(r[k])||0),0);
  const reported=rep.length?panel("From daily production reports",tbl(["Reports","Total pieces#","Pallets#","Pressed sq ft#","Peeling sq ft#","Drying sq ft#","Rejected#"],[`<tr><td>${rep.length}</td><td class="n">${num(rs("production_sheets"))}</td><td class="n">${num(rs("pallets_nos"))}</td><td class="n">${num(rs("pressed_sqft"))}</td><td class="n">${num(rs("peeling_sqft"))}</td><td class="n">${num(rs("drying_sqft"))}</td><td class="n">${num(rs("rejected"))}</td></tr>`])):"";
  const fin=finishedStock(),rawS=rawStock();
  const inventory=panel("Inventory now",tbl(["Item","Details","Balance#"],fin.map(r=>`<tr><td>${esc(r.grade)}</td><td>${r.thick} mm · ${esc(r.size)}</td><td class="n">${num(r.first)} pieces</td></tr>`).concat(rawS.map(r=>`<tr><td>${esc(r.item)}</td><td>Raw material</td><td class="n">${num(r.balance)} ${esc(r.unit)}</td></tr>`))));
  const detail=p.length||dis.length?"":'<p class="sub" style="margin:0 0 10px">The figures below add up detailed production, dispatch and money entries. None have been entered for this period yet.</p>';
  return reported+detail+`<div class="tiles">${tile(num(p.reduce((a,r)=>a+Number(r.sheets),0)),"Pieces produced",num(p.reduce((a,r)=>a+sqft(r),0))+" sq ft")}${tile(num(dis.reduce((a,r)=>a+Number(r.sheets),0)),"Pieces dispatched")}${tile(inr(billed),"Sales billed")}${tile(inr(col),"Collections")}${tile(inr(paid),"Payments made")}${tile(inr(col-paid),"Net cash")}${tile(inr(out),"Total outstanding")}${tile(inr(od),"Overdue",null,od>0)}</div>`+
  panel("Production, Monday to Saturday",tbl(["Factory","Grade","Thickness","Size","Pieces#","Sq ft#","Second#","Rejected#"],rows.map(r=>`<tr><td>${esc(r.factory)}</td><td>${esc(r.grade)}</td><td class="nw">${r.thick} mm</td><td>${esc(r.size)}</td><td class="n">${num(r.sheets)}</td><td class="n">${num(sqft(r))}</td><td class="n">${num(r.second)}</td><td class="n">${num(r.rejected)}</td></tr>`),"No production in those days."))+inventory;
}

function renderModal(){
  const L=$("layer"),M=S.modal;if(!M){L.innerHTML="";return;}
  if(M.report){L.innerHTML=`<div class="wrap" data-a="closebg"><div class="modal wide" data-stop="1" role="dialog" aria-modal="true" aria-label="Weekly report"><h2>Monday report</h2>${weeklyHTML()}<div class="actions"><button class="btn pri" data-a="close">Close</button></div></div></div>`;return;}
  const r=M.id?Api.rows(M.t).find(x=>x.id===M.id)||{}:{};
  const ctl=f=>{const v=r[f.k]!=null?r[f.k]:(f.def!=null&&!M.id?f.def:f.t==="date"&&!f.nodef&&!M.id?today():""),id="f-"+f.k;
    if(f.o)return `<select id="${id}">${f.o.map(o=>`<option ${String(o)===String(v)?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    if(f.dl)return `<input id="${id}" list="${id}-l" value="${esc(v)}" ${f.req?"required":""} autocomplete="off"><datalist id="${id}-l">${f.dl().map(o=>`<option value="${esc(o)}">`).join("")}</datalist>`;
    return `<input id="${id}" type="${f.t||"text"}" ${f.t==="number"?'step="any" min="0" inputmode="decimal"':""} value="${esc(v)}" ${f.req?"required":""} autocomplete="off">`;};
  L.innerHTML=`<div class="wrap" data-a="closebg"><form class="modal" id="recForm" data-stop="1" role="dialog" aria-modal="true" aria-label="${M.id?"Edit":"Add"} ${esc(FORMS[M.t].one)}"><h2>${M.id?"Edit":"Add"} ${esc(FORMS[M.t].one)}</h2>
  <div class="form">${formFields(M.t).map(f=>`<label>${esc(f.l)}${f.req?" *":""}${ctl(f)}</label>`).join("")}</div><div class="calc" id="calc"></div><div class="err" id="ferr" role="alert"></div>
  <div class="actions"><button class="btn pri">Save</button><button type="button" class="btn" data-a="close">Cancel</button>${M.id&&isAdmin()?`<button type="button" class="btn dang" data-a="del">Delete</button>`:""}</div></form></div>`;
  liveCalc();const first=L.querySelector("input,select");if(first)first.focus();

function liveCalc(){
  const c=$("calc");if(!c||!S.modal)return;
  if(S.modal.t==="orders"){const r={party:$("f-party").value.trim(),price_group:$("f-price_group").value,thick:$("f-thick").value,density:$("f-density").value,qty:$("f-qty").value,pallet_size:$("f-pallet_size").value};
    const g=groupOf(r),lr=g&&r.thick&&r.density?listRate(g,r.thick,r.density):null,a=area(r.pallet_size);
    c.textContent=!g?"Choose a price group, or set the customer's type, to see the list rate.":lr==null?`No list rate for ${r.thick||"?"} mm at density ${r.density||"?"} in the ${g}% group.`:`List rate ${groupLabel(g)}: ₹${num(lr)} per sq ft`+(a&&Number(r.qty)?` · ${num(r.qty)} × ${num(a)} sq ft = ₹${num(Math.round(lr*a*Number(r.qty)))}`:"");return;}
  if(!["production","dispatch"].includes(S.modal.t))return;
  const r={sheets:$("f-sheets").value,size:$("f-size").value,thick:$("f-thick").value};
  const fr=S.modal.t==="dispatch"&&$("f-grade")?floorRate($("f-grade").value,r.thick):null;
  c.textContent=(fr!=null?`Full-truckload list rate: ₹${num(fr)} per sq ft. `:"")+(Number(r.sheets)?`${num(r.sheets)} pieces × ${num(area(r.size))} sq ft = ${num(sqft(r))} sq ft · × ${r.thick} mm = ${num(sqmm(r))} sq ft × mm`:"");
}
async function saveForm(){
  const M=S.modal,rec=M.id?{id:M.id}:{},btn=document.querySelector("#recForm .btn.pri");
  formFields(M.t).forEach(f=>{let v=$("f-"+f.k).value.trim();if(f.t==="number"||f.k==="thick")v=v===""?null:Number(v);rec[f.k]=v===""?null:v;});
  if(M.t==="orders"&&rec.dispatched&&rec.value!=null&&Number(rec.received||0)<Number(rec.value)&&!M.payOK){M.payOK=true;$("ferr").textContent="Payment isn't complete. Press Save again only if this dispatch was approved anyway.";return;}
  if(M.t==="dispatch"&&!rec.customer){$("ferr").textContent="Add a customer before entering a dispatch.";return;}
  btn.disabled=true;btn.textContent="Saving…";
  try{
    if(M.t==="dispatch"&&!M.id&&!M.stockOK){
      const {data,error}=await sb.rpc("sheets_available",{p_factory:rec.factory,p_grade:rec.grade,p_thick:rec.thick,p_size:rec.size,p_quality:rec.quality});
      if(error)throw error;
      if(Number(rec.sheets)>Number(data)){M.stockOK=true;$("ferr").textContent=`The records show only ${num(data)} of these pieces at ${rec.factory}. Check the entry, or press Save again to record it anyway.`;btn.disabled=false;btn.textContent="Save";return;}
    }
    await Api.save(M.t,rec);S.modal=null;renderModal();render();
  }catch(e){$("ferr").textContent=friendly(e);btn.disabled=false;btn.textContent="Save";}
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a;
  if(a==="closebg"){if(!e.target.closest("[data-stop]")){S.modal=null;renderModal();}return;}
  if(a==="view"){S.view=el.dataset.v;render();window.scrollTo(0,0);}
  else if(a==="ledgerside"){S.ledgerSide=el.dataset.v;render();}
  else if(a==="ledger"){S.ledger=el.dataset.v;S.ledgerKind=el.dataset.k||"";S.ledgerSide=S.ledgerKind==="vendor"?"inward":"outward";S.view="ledger";render();window.scrollTo(0,0);}
  else if(a==="ledgercsv"){downloadLedger(el.dataset.v,el.dataset.k);}
  else if(a==="print"){window.print();}
  else if(a==="editprices"){S.editPrices=true;render();}
  else if(a==="cancelprices"){S.editPrices=false;render();}
  else if(a==="factory"){S.factory=el.dataset.v;render();}
  else if(a==="logout"){signOut();}
  else if(a==="backup"){downloadBackup();}
  else if(a==="add"){S.modal={t:el.dataset.t};renderModal();}
  else if(a==="edit"){S.modal={t:el.dataset.t,id:el.dataset.id};renderModal();}
  else if(a==="close"){S.modal=null;renderModal();}
  else if(a==="del"){el.outerHTML='<button type="button" class="btn dang" data-a="delyes">Yes, delete it</button>';}
  else if(a==="delyes"){Api.remove(S.modal.t,S.modal.id).then(()=>{S.modal=null;renderModal();}).catch(err=>{$("ferr").textContent=friendly(err);});}
});
document.addEventListener("input",e=>{if(e.target.id&&e.target.id.startsWith("f-"))liveCalc();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.modal){S.modal=null;renderModal();}});
document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id==="loginForm"){
    const name=$("lName").value.trim(),slug=name.toLowerCase().replace(/[^a-z0-9]/g,""),btn=e.target.querySelector("button");
    S.lastName=name;btn.disabled=true;btn.textContent="Checking…";
    const {data,error}=await sb.auth.signInWithPassword({email:name.includes("@")?name.toLowerCase():slug+"@"+(CFG.loginDomain||"staff.woodlandply.com"),password:$("lPin").value});
    if(error){S.err=/fetch|network/i.test(error.message)?"Couldn't reach the server. Check the internet.":"That name and PIN don't match. Try again, or ask an admin.";render();return;}
    try{if(await startSession(data.user.id)){S.err="";render();mondayReport();}else render();}catch(err){S.err="Signed in, but your data couldn't load. Try again.";S.user=null;render();}
  }
  if(e.target.id==="recForm")saveForm();
  if(e.target.id==="rateForm"){
    const groups={};document.querySelectorAll("input.rate").forEach(i=>{if(i.value==="")return;((groups[i.dataset.g]=groups[i.dataset.g]||{})[i.dataset.t]=groups[i.dataset.g][i.dataset.t]||{})[i.dataset.d]=Number(i.value);});
    const flooring=((DB.settings.rate_card||{}).flooring||[]).map((f,i)=>{const el=document.querySelector(`input.frate[data-i="${i}"]`);return {...f,rate:el&&el.value!==""?Number(el.value):f.rate};});
    const {error}=await sb.from("settings").update({rate_card:{date:$("rate-date").value,unit:"per sq ft",groups,flooring}}).eq("id",1);
    if(error){S.banner=friendly(error);render();return;}
    S.editPrices=false;refresh();return;
  }
  if(e.target.id==="setForm"){
    const {error}=await sb.from("settings").update({veneer_factor:Number($("s-v").value)||1,resin_per_k:Number($("s-r").value)||0}).eq("id",1);
    if(error){S.banner=friendly(error);render();return;}
    refresh();
  }
});
async function signOut(){
  if(channel){sb.removeChannel(channel);channel=null;}
  await sb.auth.signOut();S.user=null;S.err="";S.modal=null;DB=EMPTY();renderModal();render();
}
function mondayReport(){
  if(!S.user||S.user.role!=="admin"||new Date().getDay()!==1)return;
  const key="akosys-report-"+today();
  try{if(localStorage.getItem(key))return;localStorage.setItem(key,"1");}catch(e){}
  S.modal={report:true};renderModal();
}
window.addEventListener("focus",()=>{if(S.user)refresh();});
window.addEventListener("online",()=>{if(S.user)refresh();});
if("serviceWorker" in navigator)navigator.serviceWorker.register("../sw.js").catch(()=>{});
(async function boot(){
  render();
  if(!sb)return;
  try{
    const {data}=await sb.auth.getSession();
    if(data.session){await startSession(data.session.user.id);S.loading=false;render();mondayReport();return;}
  }catch(e){S.err="Couldn't reach the server. Check the internet, then sign in.";S.user=null;}
  S.loading=false;render();
})();
</script>
</body></html>
