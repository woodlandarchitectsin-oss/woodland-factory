/* ---- all data goes through here; the database itself enforces who can see and change what ---- */
async function fetchAll(table,order,cols){
  const out=[];
  for(let from=0;;from+=1000){
    let q=sb.from(table).select(cols||"*").range(from,from+999);
    if(order)q=q.order(order,{ascending:false});
    const {data,error}=await q;if(error)throw error;
    out.push(...data);if(data.length<1000)return out;
  }
}

function weeklyHTML(){
  const w=lastWeek(),inW=r=>r.date>=w.from&&r.date<=w.to;
  const p=DB.production.filter(r=>inW(r)&&r.stage!=="Opening stock"),g={};
  p.forEach(r=>{const k=[r.factory,r.grade,r.thick,r.size].join("|");g[k]=g[k]||{...r,sheets:0,second:0,rejected:0};g[k].sheets+=Number(r.sheets);g[k].second+=Number(r.second)||0;g[k].rejected+=Number(r.rejected)||0;});
  const rows=Object.values(g).sort((a,b)=>a.factory.localeCompare(b.factory)||a.grade.localeCompare(b.grade));
  const dis=DB.dispatch.filter(inW),billed=dis.reduce((a,r)=>a+(dispatchAmount(r)||0),0),col=DB.collections.filter(inW).reduce((a,r)=>a+Number(r.amount),0),paid=DB.payments.filter(inW).reduce((a,r)=>a+Number(r.amount),0);
  const rec=receivables(),out=rec.reduce((a,x)=>a+x.balance,0),od=rec.reduce((a,x)=>a+x.overdue,0);
  const rep=DB.factory_reports.filter(inW),rs=k=>rep.reduce((a,r)=>a+(Number(r[k])||0),0);
  const reported=rep.length?panel("From daily production reports",tbl(["Reports","Total pieces#","Pallets#","Pressed sq ft#","Peeling sq ft#","Drying sq ft#","Rejected#"],[`<tr><td>${rep.length}</td><td class="n">${num(rs("production_sheets"))}</td><td class="n">${num(rs("pallets_nos"))}</td><td class="n">${num(rs("pressed_sqft"))}</td><td class="n">${num(rs("peeling_sqft"))}</td><td class="n">${num(rs("drying_sqft"))}</td><td class="n">${num(rs("rejected"))}</td></tr>`])):"";
  const fin=stockBook("Finished",today().slice(0,7)+"-01",today()).filter(r=>r.close),rawS=stockBook("Raw",today().slice(0,7)+"-01",today()).filter(r=>r.close);
  const inventory=panel("Inventory now",tbl(["Item","Type","Balance#"],fin.map(r=>`<tr><td>${esc(r.item)}</td><td>Finished</td><td class="n">${num(r.close)} sq ft</td></tr>`).concat(rawS.map(r=>`<tr><td>${esc(r.item)}</td><td>Raw material</td><td class="n">${num(r.close)} ${esc(r.unit)}</td></tr>`))));
  const detail=p.length||dis.length?"":'<p class="sub" style="margin:0 0 10px">The figures below add up detailed production, dispatch and money entries. None have been entered for this period yet.</p>';
  return reported+detail+`<div class="tiles">${tile(num(p.reduce((a,r)=>a+Number(r.sheets),0)),"Pieces produced",num(p.reduce((a,r)=>a+sqft(r),0))+" sq ft")}${tile(num(dis.reduce((a,r)=>a+Number(r.sheets),0)),"Pieces dispatched")}${can("money")?tile(inr(billed),"Sales billed")+tile(inr(col),"Collections")+tile(inr(paid),"Payments made")+tile(inr(col-paid),"Net cash")+tile(inr(out),"Total outstanding")+tile(inr(od),"Overdue",null,od>0):""}</div>`+
  panel("Production, Monday to Saturday",tbl(["Factory","Grade","Thickness","Size","Pieces#","Sq ft#","Second#","Rejected#"],rows.map(r=>`<tr><td>${esc(r.factory)}</td><td>${esc(r.grade)}</td><td class="nw">${r.thick} mm</td><td>${esc(r.size)}</td><td class="n">${num(r.sheets)}</td><td class="n">${num(sqft(r))}</td><td class="n">${num(r.second)}</td><td class="n">${num(r.rejected)}</td></tr>`),"No production in those days."))+inventory;
}

  R.innerHTML=`<div class="app"><aside class="rail"><div class="brand"><b>AKOLITE</b><span>Baikampady, Mangalore</span></div><nav class="nav" aria-label="Screens">${navHTML(nav,od)}</nav><div class="who">${esc(S.user.name)} · ${esc(ROLE_LABEL[S.user.role])}<button data-a="logout">Sign out</button><div style="font-size:11px;opacity:.55;margin-top:6px">Version ${APP_VERSION}</div></div></aside><main class="main">${S.banner?`<div class="note" role="status" style="background:var(--warn-soft);color:var(--warn);border-radius:5px;margin-bottom:12px">${esc(S.banner)}</div>`:""}${main}</main></div>`;
  addListTools();
  if(S.view==="documents"&&$("docsHost"))Docs.mount($("docsHost"),{sb,biz:"akosys",areas:["Leads & orders","Machine models & pallets","Marketers","Follow-ups","Vendors","Pending payments","Customers","Collections & payments","Inward (raw material)","Production","Dispatch","Stock count","Other"]});
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a;
  if(a==="closebg"){if(!e.target.closest("[data-stop]")){S.modal=null;renderModal();}return;}
  if(a==="view"){S.view=el.dataset.v;render();window.scrollTo(0,0);}
  else if(a==="ledgerside"){S.ledgerSide=el.dataset.v;render();}
  else if(a==="ledger"){S.ledger=el.dataset.v;S.ledgerKind=el.dataset.k||"";S.ledgerSide=S.ledgerKind==="vendor"?"inward":"outward";S.view="ledger";render();window.scrollTo(0,0);}
  else if(a==="ledgercsv"){downloadLedger(el.dataset.v,el.dataset.k);}
  else if(a==="print"){window.print();}
  else if(a==="editprices"){S.editPrices=true;render();}
  else if(a==="cancelprices"){S.editPrices=false;render();}
  else if(a==="factory"){S.factory=el.dataset.v;render();}
  else if(a==="logout"){signOut();}
  else if(a==="backup"){downloadBackup();}
  else if(a==="add"){S.modal={t:el.dataset.t,k:el.dataset.k};renderModal();}
  else if(a==="newquote"){const d=today(),c=null;S.modal={q:{no:qNumber(d),date:d,party:"",items:[{product:"Pallet",thick:null,density:"",size:"",pieces:null,rate:null}],gst_pct:18,validity:"7 days",status:"Draft",notes:Q_TERMS}};renderModal();}
  else if(a==="editquote"){const q=DB.quotations.find(x=>x.id===el.dataset.id);if(q){S.modal={q:qMigrate(JSON.parse(JSON.stringify({...q,items:q.items||[]})))};renderModal();}}
  else if(a==="printquote"){if(S.modal&&S.modal.q)readQuote();const q=S.modal&&S.modal.q&&S.modal.q.id===el.dataset.id?S.modal.q:DB.quotations.find(x=>x.id===el.dataset.id);if(q)printQuote(q);}
  else if(a==="qadd"){readQuote().items.push({product:"Pallet",thick:null,density:"",size:"",pieces:null,rate:null});renderModal();}
  else if(a==="qdel"){readQuote().items.splice(Number(el.dataset.i),1);renderModal();}
  else if(a==="qfill"){const q=readQuote();qAuto(q);renderModal();}
  else if(a==="csv"){exportScreen();}
  else if(a==="qviewclose"){if(history.state&&history.state.qv)history.back();else closeQView();}
  else if(a==="qprint"){window.print();}
  else if(a==="qpdf"){const b=el;b.disabled=true;const t=b.textContent;b.textContent="Making PDF…";saveQuotePDF(window.__qq).catch(err=>{alert(err&&err.message||"The PDF couldn't be made.");}).finally(()=>{b.disabled=false;b.textContent=t;});}
  else if(a==="prset"){S.prFrom=el.dataset.f;S.prTo=el.dataset.t2;render();}
  else if(a==="moretoggle"){S.moreOpen=!S.moreOpen;render();}
  else if(a==="hidezero"){S.stockHideZero=!S.stockHideZero;render();}
  else if(a==="edit"){S.modal={t:el.dataset.t,id:el.dataset.id};renderModal();}
  else if(a==="close"){S.modal=null;renderModal();}
  else if(a==="del"){el.outerHTML='<button type="button" class="btn dang" data-a="delyes">Yes, delete it</button>';}
  else if(a==="delyes"){Api.remove(S.modal.t,S.modal.id).then(()=>{S.modal=null;renderModal();}).catch(err=>{$("ferr").textContent=friendly(err);});}
});
document.addEventListener("input",e=>{if(e.target.id&&e.target.id.startsWith("f-"))liveCalc();if(e.target.id==="tblq"){S.tq=S.tq||{};S.tq[S.view]=e.target.value;filterTables();}});
document.addEventListener("change",e=>{if(S.modal&&S.modal.q&&e.target.closest&&e.target.closest("#quoteForm")&&(e.target.classList.contains("qi")||["q-gst_pct","q-group","q-party"].includes(e.target.id))){const q=readQuote();
  if(e.target.dataset.k==="prate"){const l=q.items[e.target.dataset.i];if(l){l.auto=e.target.value==="";l.rate=null;}}qAuto(q);renderModal();}});
document.addEventListener("change",e=>{if(e.target.id==="stockMonth"&&e.target.value){S.stockMonth=e.target.value;render();}
  if((e.target.id==="prFrom"||e.target.id==="prTo")&&e.target.value){if(e.target.id==="prFrom")S.prFrom=e.target.value;else S.prTo=e.target.value;if(S.prFrom&&S.prTo&&S.prFrom>S.prTo){const t=S.prFrom;S.prFrom=S.prTo;S.prTo=t;}render();}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.modal){S.modal=null;renderModal();}});
document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id==="loginForm"){
    const name=$("lName").value.trim(),slug=name.toLowerCase().replace(/[^a-z0-9]/g,""),btn=e.target.querySelector("button");
    S.lastName=name;btn.disabled=true;btn.textContent="Checking…";
    let {data,error}=await sb.auth.signInWithPassword({email:name.includes("@")?name.toLowerCase():slug+"@"+(CFG.loginDomain||"staff.woodlandply.com"),password:$("lPin").value});
    // Akolite logins are first-name@akolite.in, so a first name alone also works
    if(error&&!name.includes("@")&&!/fetch|network/i.test(error.message))({data,error}=await sb.auth.signInWithPassword({email:name.toLowerCase().replace(/\s+/g,"")+"@akolite.in",password:$("lPin").value}));
    if(error){S.err=/fetch|network/i.test(error.message)?"Couldn't reach the server. Check the internet.":"That name and PIN don't match. Try again, or ask an admin.";render();return;}
    try{if(await startSession(data.user.id)){S.err="";render();mondayReport();}else render();}catch(err){S.err="Signed in, but your data couldn't load. Try again.";S.user=null;render();}
  }
  if(e.target.id==="recForm")saveForm();
  if(e.target.id==="quoteForm"){const q=readQuote();if(!q.party||!q.items.length){$("ferr").textContent="Add the party and at least one item.";return;}
    const rec={...q};delete rec.by;["entered_by","entered_by_name","entered_at","edited_by_name"].forEach(k=>delete rec[k]);
    try{try{await Api.save("quotations",rec);}catch(err){if(err&&err.code==="23505"&&!rec.id){await refresh();rec.no=qNumber(rec.date);await Api.save("quotations",rec);}else throw err;}S.modal=null;renderModal();render();}catch(err){$("ferr").textContent=friendly(err);}}
  if(e.target.id==="rateForm"){
    const groups={};document.querySelectorAll("input.rate").forEach(i=>{if(i.value==="")return;((groups[i.dataset.g]=groups[i.dataset.g]||{})[i.dataset.t]=groups[i.dataset.g][i.dataset.t]||{})[i.dataset.d]=Number(i.value);});
    const flooring=((DB.settings.rate_card||{}).flooring||[]).map((f,i)=>{const el=document.querySelector(`input.frate[data-i="${i}"]`);return {...f,rate:el&&el.value!==""?Number(el.value):f.rate};});
    const {error}=await sb.from("settings").update({rate_card:{date:$("rate-date").value,unit:"per sq ft",groups,flooring}}).eq("id",1);
    if(error){S.banner=friendly(error);render();return;}
    S.editPrices=false;refresh();return;
  }
  if(e.target.id==="setForm"){
    const {error}=await sb.from("settings").update({veneer_factor:Number($("s-v").value)||1,resin_per_k:Number($("s-r").value)||0}).eq("id",1);
    if(error){S.banner=friendly(error);render();return;}
    refresh();
  }
});
function addListTools(){
  const main=document.querySelector("main.main");if(!main||["today","settings","documents"].includes(S.view))return;
  const rows=main.querySelectorAll(".panel tbody tr");if(!rows.length)return;
  const first=main.querySelector(".panel");if(!first)return;S.tq=S.tq||{};
  const bar=document.createElement("div");bar.className="row listtools";bar.style.cssText="gap:8px;margin:0 0 12px;flex-wrap:wrap";
  bar.innerHTML=`<input type="search" id="tblq" placeholder="Search this screen" aria-label="Search this screen" value="${esc(S.tq[S.view]||"")}" style="flex:1;min-width:200px;max-width:420px"><button class="btn" data-a="csv">Export to Excel</button><span class="sub" id="tblcount"></span>`;
  first.before(bar);filterTables();
}
function filterTables(){
  const q=(S.tq&&S.tq[S.view]||"").trim().toLowerCase(),words=q.split(/\s+/).filter(Boolean);let shown=0,all=0;
  document.querySelectorAll("main.main .panel tbody tr").forEach(tr=>{if(tr.classList.contains("tot"))return;all++;const ok=!words.length||words.every(w=>tr.innerText.toLowerCase().includes(w));tr.style.display=ok?"":"none";if(ok)shown++;});
  const c=$("tblcount");if(c)c.textContent=words.length?shown+" of "+all+" shown":"";
}
function exportScreen(){
  const q=v=>{let t=String(v==null?"":v).replace(/\s+/g," ").trim();if(/^[=+\-@]/.test(t)&&!/^-?[\d.,₹]+$/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';},lines=[["Akolite Industrial Systems"],[(document.querySelector("main h1")||{}).innerText||S.view],["Exported "+today()+(S.tq&&S.tq[S.view]?" · search: "+S.tq[S.view]:"")],[]];
  document.querySelectorAll("main.main .panel").forEach(p=>{const t=p.querySelector("table");if(!t)return;lines.push([(p.querySelector("h2")||{}).innerText||""]);
    lines.push([...t.querySelectorAll("thead th")].map(th=>th.innerText).filter((h,i,a)=>i<a.length-1||h));
    t.querySelectorAll("tbody tr").forEach(tr=>{if(tr.style.display==="none")return;lines.push([...tr.cells].filter(td=>!td.querySelector("button")||td.innerText.replace(/Edit|Ledger|Print|Update|Change status|Set price/g,"").trim()).map(td=>td.innerText.replace(/\b(Edit|Ledger|Print|Update|Change status|Set price)\b/g,"").trim()));});lines.push([]);});
  const csv=lines.map(r=>r.map(q).join(",")).join("\r\n"),u=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"})),a=document.createElement("a");
  a.href=u;a.download="Akolite-"+S.view+"-"+today()+".csv";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
}
async function signOut(){
  if(channel){sb.removeChannel(channel);channel=null;}
  await sb.auth.signOut();S.user=null;S.err="";S.modal=null;DB=EMPTY();renderModal();render();
}
function mondayReport(){
  if(!S.user||S.user.role!=="admin"||new Date().getDay()!==1)return;
  const key="akosys-report-"+today();
  try{if(localStorage.getItem(key))return;localStorage.setItem(key,"1");}catch(e){}
  S.modal={report:true};renderModal();
}
window.addEventListener("focus",()=>{if(S.user)refresh();});
window.addEventListener("online",()=>{if(S.user)refresh();});
if("serviceWorker" in navigator)navigator.serviceWorker.register("../sw.js").catch(()=>{});
try{fetch(location.pathname,{cache:"no-store"}).then(r=>r.text()).then(t=>{const m=t.match(/const APP_VERSION="([^"]+)"/);if(m&&m[1]!==APP_VERSION&&!sessionStorage.getItem("akUpdated")){sessionStorage.setItem("akUpdated","1");const u=new URL(location.href);u.searchParams.set("_v",Date.now());location.replace(u.href);}}).catch(()=>{});}catch(e){}
(async function boot(){
  render();
  if(!sb)return;
  try{
    const {data}=await sb.auth.getSession();
    if(data.session){await startSession(data.session.user.id);S.loading=false;render();mondayReport();return;}
  }catch(e){S.err="Couldn't reach the server. Check the internet, then sign in.";S.user=null;}
  S.loading=false;render();
})();
</script>
